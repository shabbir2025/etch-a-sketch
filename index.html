<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch e Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <div class="other">
        <p>Enter Grid Size</p>
         <input type="number" class="grid-number">
         <button class="submit-btn">Submit</button>
         <button class="reset-btn">Reset</button>
         <div class="buttons">
            <p>Choose Color</p>
            <button class="black-color">Black</button>
            <button class="random-color">Random</button>
            <p>Choose Style</p>
            <button class="ink">Ink</button>
            <button class="brush">Brush</button>
         </div>
        </div>
        <div class="container"></div>
    </div>
</body>
</html>
